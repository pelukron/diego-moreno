name: Gate (reusable)

# Single Gate invocation module: checkout + Node 22 + the Gate entry.
# Called by gate.yml (PR and master) and release.yml (tag runs).
# Zero inputs: the Node version and the gate command are pinned here,
# so version bumps land in one module.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node scripts/gate.mjs
